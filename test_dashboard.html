<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>测试</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body style="background:#060b1c; color:#fff; padding:20px;">
<h1>图表测试</h1>
<div id="test" style="width:600px; height:400px; background:#0f172a; border:1px solid #3b82f6;"></div>
<script>
console.log('开始初始化...');
const chart = echarts.init(document.getElementById('test'));
console.log('图表实例:', chart);
chart.setOption({
    xAxis: { type: 'category', data: ['A', 'B', 'C'] },
    yAxis: { type: 'value' },
    series: [{ data: [10, 20, 30], type: 'bar' }]
});
console.log('设置完成');
</script>
</body>
</html>
