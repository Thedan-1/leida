<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锅炉安全物联网+监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060b1c;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 背景动画网格 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* 顶部标题栏 */
        .header {
            height: 80px;
            background: linear-gradient(to bottom, rgba(10, 20, 50, 0.95), rgba(10, 20, 50, 0.7));
            border-bottom: 2px solid rgba(59, 130, 246, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            position: relative;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #60a5fa, #3b82f6, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            letter-spacing: 3px;
        }

        .header-info {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .header-info span {
            color: #94a3b8;
            font-size: 14px;
            font-family: "Courier New", monospace;
        }

        .header-info .status {
            padding: 6px 16px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            border-radius: 4px;
            color: #10b981;
            font-weight: bold;
        }

        /* 主容器 */
        .main-container {
            display: grid;
            grid-template-columns: 360px 1fr 360px;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 16px;
            padding: 20px;
            height: calc(100vh - 100px);
            position: relative;
            z-index: 1;
        }

        /* 通用面板样式 */
        .panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            padding: 20px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }

        .panel:hover {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15);
        }

        /* 面板装饰角 */
        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
        }

        .panel::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid #3b82f6;
            border-left: 2px solid #3b82f6;
        }

        .panel::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid #3b82f6;
            border-right: 2px solid #3b82f6;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid #3b82f6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(59, 130, 246, 0.3), transparent);
            margin-left: 12px;
        }

        /* 左侧列 */
        .left-top { grid-column: 1; grid-row: 1; }
        .left-mid { grid-column: 1; grid-row: 2; }
        .left-bottom { grid-column: 1; grid-row: 3; }

        /* 中间3D区域 */
        .center-3d {
            grid-column: 2;
            grid-row: 1 / 4;
            background: rgba(10, 15, 30, 0.85);
            padding: 0;
            overflow: hidden;
        }

        #boiler3d {
            width: 100%;
            height: 100%;
        }

        .boiler-info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 20px;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }

        .boiler-info h3 {
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .boiler-info p {
            font-size: 13px;
            color: #94a3b8;
            margin: 4px 0;
        }

        /* 右侧列 */
        .right-top { grid-column: 3; grid-row: 1; }
        .right-mid { grid-column: 3; grid-row: 2; }
        .right-bottom { grid-column: 3; grid-row: 3; }

        /* 数据卡片网格 */
        .data-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .data-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(30, 41, 59, 0.3));
            padding: 14px;
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            text-align: center;
            transition: all 0.3s;
        }

        .data-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .data-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
            font-family: "Courier New", monospace;
            margin-bottom: 6px;
        }

        .data-card.warning .value { color: #f59e0b; }
        .data-card.danger .value { color: #ef4444; }
        .data-card.success .value { color: #10b981; }

        .data-card .label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* 记录列表 */
        .record-list {
            max-height: 100%;
            overflow-y: auto;
        }

        .record-item {
            background: rgba(30, 41, 59, 0.4);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #3b82f6;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .record-item:hover {
            background: rgba(59, 130, 246, 0.15);
            transform: translateX(4px);
        }

        .record-item.alert {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .record-item .time {
            color: #60a5fa;
            font-family: monospace;
            font-size: 11px;
        }

        .record-item .content {
            color: #cbd5e1;
            margin-top: 4px;
        }

        /* 滚动条 */
        .record-list::-webkit-scrollbar {
            width: 6px;
        }

        .record-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .record-list::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 3px;
        }

        .record-list::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.8);
        }

        /* 数据点标记 */
        .data-point {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        .data-point.normal {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .data-point.warning {
            background: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
        }

        .data-point.danger {
            background: #ef4444;
            box-shadow: 0 0 15px #ef4444;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.6; }
        }

    </style>
</head>
<body>

    <!-- 顶部标题栏 -->
    <div class="header">
        <h1>锅炉安全物联网+监控系统</h1>
        <div class="header-info">
            <span id="datetime">2026-01-22 14:30:15</span>
            <span class="status">● 系统正常</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        
        <!-- 左上：总体概况 -->
        <div class="panel left-top">
            <div class="panel-title">总体概况</div>
            <div class="data-cards">
                <div class="data-card success">
                    <div class="value">31</div>
                    <div class="label">在线设备</div>
                </div>
                <div class="data-card danger">
                    <div class="value">2</div>
                    <div class="label">告警数</div>
                </div>
                <div class="data-card">
                    <div class="value">15</div>
                    <div class="label">今日巡检</div>
                </div>
                <div class="data-card success">
                    <div class="value">94%</div>
                    <div class="label">完好率</div>
                </div>
            </div>
        </div>

        <!-- 左中：12小时趋势 -->
        <div class="panel left-mid">
            <div class="panel-title">排烟温度趋势（12H）</div>
            <div id="chartLine" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 左下：设备状态 -->
        <div class="panel left-bottom">
            <div class="panel-title">设备运行状态</div>
            <div id="chartRadar" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 中间：3D锅炉 -->
        <div class="panel center-3d">
            <div class="boiler-info">
                <h3>主控锅炉机组</h3>
                <p>● 运行时长: 1856小时</p>
                <p>● 燃烧效率: 92.3%</p>
                <p>● 实时功率: 8.6MW</p>
            </div>
            <div id="boiler3d"></div>
        </div>

        <!-- 右上：关键指标 -->
        <div class="panel right-top">
            <div class="panel-title">关键运行参数</div>
            <div id="chartGauge" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 右中：隐患分布 -->
        <div class="panel right-mid">
            <div class="panel-title">隐患类型分布</div>
            <div id="chartPie" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 右下：实时告警 -->
        <div class="panel right-bottom">
            <div class="panel-title">实时告警列表</div>
            <div class="record-list" id="alarmList"></div>
        </div>

    </div>

    <script>
        // ============ 时间更新 ============
        function updateTime() {
            document.getElementById('datetime').innerText = new Date().toLocaleString('zh-CN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ============ 2. 生成模拟数据 (15组真实场景) ============
        const teams = ['王工', '李工', '张班长', '赵队', '孙师傅'];
        const locations = ['#1号锅炉', '#2号锅炉', '主控机组', '辅助炉', '冷却系统'];
        
        const mockData = [];
        const baseTime = new Date().getTime();

        for (let i = 0; i < 15; i++) {
            const isAbnormal = Math.random() > 0.85;
            const temp = 60 + Math.random() * 35;
            const pressure = 1.0 + Math.random() * 1.0;
            
            mockData.push({
                id: i,
                inspector: teams[Math.floor(Math.random() * teams.length)],
                location: locations[Math.floor(Math.random() * locations.length)],
                time: new Date(baseTime - i * 360000).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}),
                timestamp: baseTime - i * 360000,
                // 模拟GPS/LiDAR坐标 (假设基准点 (0,0,0) 在主控机组)
                pos: {
                    x: (Math.random() - 0.5) * 50,  // 单位米
                    y: (Math.random() - 0.5) * 30,
                    z: Math.random() * 10  // 高度
                },
                temp: temp.toFixed(1),
                pressure: pressure.toFixed(2),
                humidity: (30 + Math.random() * 40).toFixed(1),
                status: isAbnormal ? "告警" : "正常",
                abnormalType: isAbnormal ? 
                    (Math.random() > 0.5 ? "温度过高" : "压力异常") : null
            });
        }

        // ============ 3. 绘制中心地图 (Canvas) ============
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        function drawBoilerRoom() {
            // 清空
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 网格背景
            ctx.strokeStyle = 'rgba(96, 165, 250, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 中心锅炉 (大矩形)
            ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.fillRect(140, 120, 120, 160);
            ctx.strokeRect(140, 120, 120, 160);
            
            ctx.fillStyle = '#60a5fa';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('主控锅炉机组', 200, 205);

            // 辅助锅炉 (圆形)
            const auxiliaryBoilers = [
                {x: 80, y: 80, label: '#1'},
                {x: 80, y: 240, label: '#2'},
                {x: 320, y: 150, label: '#3'}
            ];

            auxiliaryBoilers.forEach(boiler => {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(boiler.x, boiler.y, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(boiler.label, boiler.x, boiler.y);
            });

            // 检测点 (红点/绿点)
            mockData.forEach((d, idx) => {
                // 坐标转换: pos (米) -> canvas (像素, 基准200,200)
                const px = 200 + d.pos.x * 2;  // 缩放系数
                const py = 200 + d.pos.y * 2;

                if (d.status === '告警') {
                    // 红点 + 脉冲动画
                    ctx.fillStyle = '#ef4444';
                    const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
                    ctx.beginPath();
                    ctx.arc(px, py, 6 * pulse, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(px, py, 6 * pulse + 3, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    // 绿点
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath();
                    ctx.arc(px, py, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 绘制轴标签
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('X (东-西) →', canvas.width - 20, canvas.height - 5);
            ctx.save();
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.fillText('Y (南-北) →', -canvas.height / 2, 12);
            ctx.restore();
        }

        // 动画循环
        function animateMap() {
            drawBoilerRoom();
            requestAnimationFrame(animateMap);
        }
        animateMap();

        // ============ 4. 填充右侧数据面板 ============
        
        // 巡检队伍
        const teamList = document.getElementById('teamList');
        teams.forEach((name, idx) => {
            const item = document.createElement('div');
            item.className = 'record-item';
            const lastRecord = mockData.find(d => d.inspector === name);
            item.innerHTML = `
                <div style="font-weight: bold; color: #60a5fa;">● ${name}</div>
                <div style="color: #cbd5e1; font-size: 11px; margin-top: 3px;">
                    最后位置: ${lastRecord ? lastRecord.location : '待检'} | ${lastRecord ? lastRecord.time : '--:--'}
                </div>
            `;
            teamList.appendChild(item);
        });

        // 实时告警
        const alarmList = document.getElementById('alarmList');
        mockData.filter(d => d.status === '告警').forEach(d => {
            const item = document.createElement('div');
            item.className = 'record-item alert';
            item.innerHTML = `
                <div style="font-weight: bold; color: #fca5a5;">⚠ ${d.abnormalType}</div>
                <div style="color: #cbd5e1; font-size: 11px; margin-top: 2px;">
                    ${d.time} | ${d.inspector} | ${d.location}
                </div>
                <div style="color: #f87171; font-size: 10px; margin-top: 2px;">
                    温度: ${d.temp}°C | 压力: ${d.pressure} MPa
                </div>
            `;
            alarmList.appendChild(item);
        });

        // 最新检测数据
        const latestData = document.getElementById('latestData');
        mockData.slice(0, 6).forEach(d => {
            const item = document.createElement('div');
            item.className = 'record-item';
            item.innerHTML = `
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #60a5fa;">${d.inspector}</span>
                    <span style="color: ${d.status === '告警' ? '#ef4444' : '#10b981'};">${d.status}</span>
                </div>
                <div style="color: #cbd5e1; font-size: 11px; margin-top: 3px;">
                    ${d.time} | 温度 ${d.temp}°C | 湿度 ${d.humidity}%
                </div>
            `;
            latestData.appendChild(item);
        });

        // ============ 5. ECharts 图表 ============

        // 仪表盘 - 系统完成度
        const chartGauge = echarts.init(document.getElementById('chartGauge'));
        chartGauge.setOption({
            series: [{
                type: 'gauge',
                startAngle: 200,
                endAngle: -20,
                radius: '85%',
                center: ['50%', '60%'],
                min: 0,
                max: 100,
                splitNumber: 10,
                progress: { show: true, width: 8, itemStyle: { color: '#3b82f6' } },
                axisLine: { lineStyle: { width: 12, color: [[1, 'rgba(96, 165, 250, 0.2)']] } },
                axisTick: { show: false },
                splitLine: { lineStyle: { width: 1, color: '#334155' } },
                axisLabel: { color: '#94a3b8', fontSize: 10, distance: -30 },
                detail: { 
                    valueAnimation: true, 
                    formatter: '{value}%',
                    fontSize: 24,
                    fontWeight: 'bold',
                    color: '#60a5fa',
                    offsetCenter: [0, '40%']
                },
                data: [{ value: 87, name: '系统完成度' }]
            }]
        });

        // 饼图 - 隐患分布
        const chartPie = echarts.init(document.getElementById('chartPie'));
        chartPie.setOption({
            tooltip: { trigger: 'item', backgroundColor: 'rgba(0, 0, 0, 0.8)' },
            series: [{
                type: 'pie',
                radius: ['35%', '65%'],
                center: ['50%', '50%'],
                itemStyle: { borderRadius: 5, borderColor: '#1e293b', borderWidth: 2 },
                label: { show: true, position: 'outside', color: '#cbd5e1', fontSize: 11 },
                data: [
                    { value: 1520, name: '正常运行', itemStyle: { color: '#10b981' } },
                    { value: 380, name: '轻微异常', itemStyle: { color: '#f59e0b' } },
                    { value: 95, name: '严重告警', itemStyle: { color: '#ef4444' } },
                ]
            }]
        });

        // 折线图 - 温度趋势
        const chartLine = echarts.init(document.getElementById('chartLine'));
        const tempData = [];
        for (let i = 23; i >= 0; i--) {
            tempData.push((65 + Math.sin(i / 5) * 15 + Math.random() * 5).toFixed(1));
        }
        chartLine.setOption({
            grid: { left: '10%', right: '10%', top: '15%', bottom: '15%', containLabel: true },
            xAxis: { 
                type: 'category',
                boundaryGap: false,
                data: Array.from({length: 24}, (_, i) => i + ':00'),
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#94a3b8', fontSize: 10 }
            },
            yAxis: { 
                type: 'value',
                axisLine: { lineStyle: { color: '#334155' } },
                splitLine: { lineStyle: { color: '#1e293b' } },
                axisLabel: { color: '#94a3b8', fontSize: 10 }
            },
            series: [{
                data: tempData,
                type: 'line',
                smooth: true,
                lineStyle: { color: '#8b5cf6', width: 2 },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(139, 92, 246, 0.4)' },
                        { offset: 1, color: 'rgba(139, 92, 246, 0)' }
                    ])
                },
                symbol: 'circle',
                symbolSize: 4,
                itemStyle: { color: '#8b5cf6' }
            }]
        });

        // 柱状图 - 压力分布
        const chartBar = echarts.init(document.getElementById('chartBar'));
        chartBar.setOption({
            grid: { left: '15%', right: '10%', top: '15%', bottom: '15%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['#1号', '#2号', '主控', '#3号', '冷却'],
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#94a3b8', fontSize: 10 }
            },
            yAxis: {
                type: 'value',
                axisLine: { lineStyle: { color: '#334155' } },
                splitLine: { lineStyle: { color: '#1e293b' } },
                axisLabel: { color: '#94a3b8', fontSize: 10 }
            },
            series: [{
                data: [1.2, 1.5, 1.8, 1.3, 0.9].map(v => (v + Math.random() * 0.3).toFixed(2)),
                type: 'bar',
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#60a5fa' },
                        { offset: 1, color: '#3b82f6' }
                    ])
                },
                emphasis: { itemStyle: { color: '#93c5fd' } }
            }]
        });

        // 窗口缩放事件
        window.addEventListener('resize', () => {
            chartGauge.resize();
            chartPie.resize();
            chartLine.resize();
            chartBar.resize();
        });

    </script>
</body>
</html>
